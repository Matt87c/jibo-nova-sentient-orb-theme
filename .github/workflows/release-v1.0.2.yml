name: Publish jibo-nova-sentient-orb-theme v1.0.2

on:
  push:
    branches: [main]
    paths:
      - 'release-trigger/v1.0.2.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-v1.0.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Rebuild and verify BEacon theme with blue listening artwork
        run: |
          set -euo pipefail
          python scripts/build_release.py
          python scripts/validate_release.py
          test "$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')" = "1.0.2"
      - name: Create immutable version-tagged stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo "v1.0.2 already exists; refusing overwrite" >&2
            exit 1
          fi
          gh release create v1.0.2 \
            "dist/jibo-nova-sentient-orb-theme.zip" \
            --title "jibo-nova-sentient-orb-theme v1.0.2 - blue listening eye" \
            --notes "Preserves the original eye design and eye geometry. Adds a distinct electric-blue listening iris, updated metadata and verification. Owner confirmed local Jibo test; full hardware test checklist remains unverified. Install the attached ZIP using BEacon Store Themes, not the GitHub source ZIP." \
            --target "$GITHUB_SHA" \
            --latest
